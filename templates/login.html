<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d3a">
<title>Đăng nhập chỉnh sửa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
<style>
:root{--teal:#0f6b63;--deep:#0b3d3a;--line:#d5e3df;--muted:#5a6f6b}
*{box-sizing:border-box}
body{
  margin:0; min-height:100dvh; font:16px/1.45 "Be Vietnam Pro",system-ui,sans-serif; color:#102a27;
  background:radial-gradient(800px 400px at 20% 0%,#9fd8d066,transparent),linear-gradient(165deg,#e8f3f0,#f4f8f6);
  display:flex; align-items:center; justify-content:center; padding:20px 14px;
}
.card{
  width:100%; max-width:420px; background:#fffc; border:1px solid #fff;
  border-radius:20px; padding:24px 20px; box-shadow:0 16px 40px #0b3d3a14;
}
h1{font-family:Fraunces,Georgia,serif; font-size:1.55rem; margin:0 0 8px; color:var(--deep)}
p{margin:0 0 14px; color:var(--muted); font-size:14px}
.flash{background:#ecfdf5; border:1px solid #a7f3d0; color:#047857; padding:10px 12px; border-radius:10px; margin-bottom:12px; font-size:14px}
label.check{display:flex; gap:10px; align-items:flex-start; font-size:14px; color:var(--muted); margin:12px 0}
input[type=password]{
  width:100%; min-height:48px; padding:0 14px; border:1px solid var(--line); border-radius:12px; font:inherit; background:#fff;
}
button{
  width:100%; min-height:48px; margin-top:8px; border:0; border-radius:12px;
  background:var(--teal); color:#fff; font:700 15px "Be Vietnam Pro",system-ui; cursor:pointer;
}
a{color:var(--teal); font-weight:600; display:inline-block; margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <h1>Đăng nhập chỉnh sửa</h1>
  <p>Chưa đăng nhập: chỉ xem. Đăng nhập: điểm danh, ghi nhận và sửa dữ liệu.</p>
  {% for m in get_flashed_messages() %}<div class="flash">{{m}}</div>{% endfor %}
  <form method="post">
    <input type="hidden" name="next" value="{{next}}">
    <input type="password" name="password" placeholder="Mật khẩu chỉnh sửa" required autofocus autocomplete="current-password">
    <label class="check"><input type="checkbox" name="remember" value="yes"> Ghi nhớ trên thiết bị này (tối đa 30 ngày)</label>
    <button type="submit">Đăng nhập</button>
  </form>
  <a href="/">← Về danh sách lớp</a>
</div>
</body>
</html>
