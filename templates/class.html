<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{cl.name}}</title>
<style>body{font:15px system-ui;background:#f3f6fa;color:#182638}.wrap{max-width:1100px;margin:auto;padding:22px}.top,.panel{background:white;padding:18px;border-radius:14px;margin-bottom:16px}.top{background:#173b63;color:white}table{width:100%;border-collapse:collapse;background:white}th,td{padding:10px;border-bottom:1px solid #e3e8ee;text-align:left}select,input{padding:7px;border:1px solid #ccd5df;border-radius:7px}button,.btn{background:#1769aa;color:white;border:0;padding:10px 14px;border-radius:8px;text-decoration:none;cursor:pointer}.scroll{overflow:auto}</style>
<div class="wrap"><header class="top"><a style="color:white" href="/">← Các lớp</a><h1>{{cl.name}}</h1><div>{{students|length}} học sinh</div></header>
<section class="panel"><form method="get"><label>Ngày <input type="date" name="day" value="{{day}}"></label> <label>Tiết <select name="period">{% for p in range(1,10) %}<option value="{{p}}" {% if period|string==p|string %}selected{% endif %}>{{p}}</option>{% endfor %}</select></label> <button>Xem</button></form></section>
<form action="/attendance/{{cl.id}}" method="post"><input type="hidden" name="day" value="{{day}}"><input type="hidden" name="period" value="{{period}}"><div class="scroll"><table><thead><tr><th>STT</th><th>Mã HS</th><th>Họ tên</th><th>Ngày sinh</th><th>Ghi chú</th><th>Điểm danh</th></tr></thead><tbody>
{% for s in students %}<tr><td>{{s.stt}}</td><td>{{s.code}}</td><td>{{s.name}}</td><td>{{s.dob}}</td><td>{{s.note}}</td><td><select name="status_{{s.id}}">{% for v in ['Có mặt','Vắng có phép','Vắng không phép','Đi trễ'] %}<option {% if s.status==v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></td></tr>{% endfor %}
</tbody></table></div><p><button>Lưu điểm danh</button> <a class="btn" href="/class/{{cl.id}}/export">Xuất LaTeX</a></p></form></div></html>
