<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d3a">
<title>Đổi mật khẩu</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
<style>
:root{--teal:#0f6b63;--deep:#0b3d3a;--line:#d5e3df;--muted:#5a6f6b}
*{box-sizing:border-box}
body{
  margin:0; min-height:100dvh; font:16px/1.45 "Be Vietnam Pro",system-ui,sans-serif; color:#102a27;
  background:radial-gradient(800px 400px at 80% 0%,#f0c27a44,transparent),linear-gradient(165deg,#e8f3f0,#f4f8f6);
  display:flex; align-items:center; justify-content:center; padding:20px 14px;
}
.card{width:100%; max-width:420px; background:#fffc; border-radius:20px; padding:24px 20px; box-shadow:0 16px 40px #0b3d3a14}
h1{font-family:Fraunces,Georgia,serif; font-size:1.45rem; margin:0 0 14px; color:var(--deep)}
.flash{background:#ecfdf5; border:1px solid #a7f3d0; color:#047857; padding:10px 12px; border-radius:10px; margin-bottom:12px; font-size:14px}
input{
  width:100%; min-height:48px; padding:0 14px; margin:0 0 10px; border:1px solid var(--line); border-radius:12px; font:inherit;
}
button{
  width:100%; min-height:48px; border:0; border-radius:12px; background:var(--teal); color:#fff;
  font:700 15px "Be Vietnam Pro",system-ui; cursor:pointer;
}
a{color:var(--teal); font-weight:600; display:inline-block; margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <h1>Đổi mật khẩu chỉnh sửa</h1>
  {% for m in get_flashed_messages() %}<div class="flash">{{m}}</div>{% endfor %}
  <form method="post">
    <input type="password" name="new_password" placeholder="Mật khẩu mới (≥ 10 ký tự)" required minlength="10" autocomplete="new-password">
    <input type="password" name="confirm_password" placeholder="Nhập lại mật khẩu mới" required minlength="10" autocomplete="new-password">
    <button type="submit">Lưu mật khẩu mới</button>
  </form>
  <a href="/">← Về danh sách lớp</a>
</div>
</body>
</html>
