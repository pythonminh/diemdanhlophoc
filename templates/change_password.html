<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đổi mật khẩu</title><style>body{font:16px system-ui;background:#f3f6fb;color:#172033;max-width:520px;margin:8vh auto;padding:16px}.card{background:white;padding:24px;border-radius:16px;border:1px solid #dfe7f3}input,button{width:100%;padding:12px;margin:8px 0;border:1px solid #ccd6e5;border-radius:9px;font:inherit}button{background:#315de8;color:white;border:0;font-weight:700}</style><div class="card"><h2>Đổi mật khẩu chỉnh sửa</h2>{% for m in get_flashed_messages() %}<p>{{m}}</p>{% endfor %}<form method="post"><input type="password" name="new_password" placeholder="Mật khẩu mới (ít nhất 10 ký tự)" required minlength="10"><input type="password" name="confirm_password" placeholder="Nhập lại mật khẩu mới" required minlength="10"><button>Lưu mật khẩu mới</button></form><a href="/">Về danh sách lớp</a></div></html>
