<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Điểm danh Thầy Minh</title>
<style>body{font:16px system-ui;background:#f3f6fa;margin:0;color:#182638}.wrap{max-width:1000px;margin:auto;padding:24px}.head{background:#173b63;color:white;padding:24px;border-radius:16px}.panel,.item{background:white;padding:18px;border-radius:14px;margin:16px 0;box-shadow:0 2px 12px #10203012}button,a.btn{background:#1769aa;color:white;border:0;padding:10px 15px;border-radius:9px;text-decoration:none;cursor:pointer}.item{display:flex;justify-content:space-between;align-items:center}input{padding:9px;border:1px solid #ccd5df;border-radius:8px}</style>
<div class="wrap"><header class="head"><h1>Điểm danh Thầy Minh</h1><div>Quản lý lớp từ danh sách LaTeX</div></header>
<section class="panel"><h2>Nhập danh sách lớp</h2><p>Mỗi file .tex là một lớp; tên file sẽ trở thành tên lớp (ví dụ 12QT1.tex).</p><form action="/import" method="post" enctype="multipart/form-data"><input type="file" name="files" accept=".tex" multiple required> <button>Nhập / cập nhật</button></form></section>
<h2>Các lớp</h2>{% for cl in classes %}<div class="item"><div><b>{{cl.name}}</b><div>{{cl.n}} học sinh</div></div><a class="btn" href="/class/{{cl.id}}">Mở điểm danh</a></div>{% else %}<p>Chưa có lớp. Hãy nhập file LaTeX.</p>{% endfor %}</div></html>
