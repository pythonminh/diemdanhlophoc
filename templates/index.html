<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Điểm danh lớp</title><style>body{font:16px Arial;max-width:1000px;margin:30px auto;padding:0 16px;background:#f5f7fb;color:#172033}section,.card{background:white;padding:18px;border-radius:12px;margin:14px 0;box-shadow:0 2px 8px #0001}input,button{padding:10px;margin:4px;border:1px solid #ccd2df;border-radius:7px}button{background:#2457d6;color:white;border:0;cursor:pointer}a{color:#2457d6}</style><body><h1>Quản lý điểm danh lớp</h1>{% for m in get_flashed_messages() %}<p>{{m}}</p>{% endfor %}<section><h2>Tạo lớp</h2><form method="post" action="/class/add"><input name="name" placeholder="Tên lớp (VD: 12QT1)" required><button>Tạo lớp</button></form></section><h2>Danh sách lớp</h2>{% for cl in classes %}<div class="card"><a href="/class/{{cl.id}}"><b>{{cl.name}}</b></a> — {{cl.school_year or "Chưa nhập năm học"}} | GVCN: {{cl.homeroom_teacher or "—"}}</div>{% else %}<p>Chưa có lớp. Hãy tạo lớp mới.</p>{% endfor %}</body></html>
