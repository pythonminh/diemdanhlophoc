services:
  - type: web
    name: diemdanhlophoc
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: mkdir -p /var/data && gunicorn app:app
    plan: starter
    envVars:
      - key: DATABASE_PATH
        value: /var/data/diemdanh.db
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
    disk:
      name: diemdanhlophoc-data
      mountPath: /var/data
      sizeGB: 1
