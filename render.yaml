services:
  - type: web
    name: diemdanhlophoc
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Free tier: no Persistent Disk. App falls back to ./diemdanh.db if /var/data is missing.
    # With paid Disk: set DATABASE_PATH=/var/data/diemdanh.db and mount disk at /var/data.
    startCommand: gunicorn app:app
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      # Optional (only if you attach a Persistent Disk on a paid plan):
      # - key: DATABASE_PATH
      #   value: /var/data/diemdanh.db
